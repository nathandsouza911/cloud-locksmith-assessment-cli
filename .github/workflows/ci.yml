name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Test & build (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run test suite
        run: uv run pytest tests/ -v

      - name: Build distribution (wheel + sdist)
        run: uv build

      - name: Verify installed console entry point
        shell: bash
        run: |
          # Install the built wheel into a clean venv and confirm the
          # `cloudlocksmith` command works outside the source tree.
          python -m venv /tmp/rc
          /tmp/rc/bin/python -m pip install --quiet "$(ls -t dist/*.whl | head -1)"
          /tmp/rc/bin/cloudlocksmith --help
          /tmp/rc/bin/cloudlocksmith assess --help
